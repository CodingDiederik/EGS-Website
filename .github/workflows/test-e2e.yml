name: Tests@e2e

on: 
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Use the backend's docker-compose to start the DB so it matches local setup.
    env:
      PORT: 8080
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_USER: egs_user
      POSTGRES_PASSWORD: egs_password
      POSTGRES_DB: egs_database

    steps:
      - uses: actions/checkout@v5
      - name: Setup packages
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install -g pnpm
      - run: pnpm install

      - name: Start backend services with docker compose
        run: |
          echo "Starting docker compose services..."
          docker compose -f egs-backend/docker-compose.yaml up -d db

      # Ensure we have the psql client so we can wait for the DB to be ready.
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..30}; do
            pg_isready -h localhost -p ${DB_PORT} -U ${POSTGRES_USER} && break
            echo "Postgres not ready yet (attempt $i), sleeping 2s..."
            sleep 2
          done
      
      - name: copy env file
        run: |
          cd egs-backend
          pnpm run copy:env
          cd ..

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Tear down compose (always)
        if: always()
        run: |
          echo "Tearing down docker compose services..."
          docker compose -f egs-backend/docker-compose.yaml down -v
