name: Tests@e2e

on: 
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Use the backend's docker-compose to start the DB so it matches local setup.
    env:
      PORT: 8080
      DB_HOST: localhost
      DB_PORT: 5432
      POSTGRES_USER: egs_user
      POSTGRES_PASSWORD: egs_password
      POSTGRES_DB: egs_database

    steps:
      - uses: actions/checkout@v5
      - name: Setup packages
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm install -g pnpm
      - run: pnpm install
      
      - name: copy env file
        run: |
          cd egs-backend
          pnpm run copy:env

      - name: Run e2e tests
        run: pnpm test:e2e

